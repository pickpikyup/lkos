# Local Knowledge OS POC 默认配置。
# 用户配置文件（<LKOS_HOME>/config.yaml）只需写要覆盖的字段，其余取这里的默认值。

providers:
  local:
    type: ollama
    base_url: http://127.0.0.1:11434
    keep_alive: 30m
    timeout_s: 120
  hermes:                       # 远端 Provider，POC 只保留接口
    type: hermes
    base_url: null
    api_key_ref: keychain:lkos-hermes

models:
  chat:
    # 8 GB 内存实测：8K 上下文时交换区增长约 8 GB，改为 4K（KV 缓存减半，约 0.6 GB）
    local/qwen3:4b-instruct:
      context_window: 4096
      think: false
    local/qwen3:1.7b:              # 更小的候选模型，用于对比测试
      context_window: 4096
      think: false
  embedding:
    ref: local/bge-m3
    dim: 1024
    batch_size: 32

tasks:
  knowledge_qa:
    default_model: local/qwen3:4b-instruct
    temperature: 0.3
    max_tokens: 512                # 实测回答多在 50 tokens 以内；留足 4K 上下文给 4 个片段

indexing:
  extensions: all     # 所有能识别的格式；也可以列出要的扩展名，如 [.pdf, .docx, .md]
                      # .doc / .rtf 在 macOS 上用自带的 textutil 转换；.ppt / .xls / WPS / iWork 只提示另存为
  max_file_size_mb: 100
  # 按语言切块：中文约 500 字、英文 / 法文约 1,200 字符，重叠 15%（两种语言的片段 token 数接近）
  # 修改后各来源会自动重新切块（向量按文本缓存，未改动的文本不重算）
  chunk_chars_zh: 500
  chunk_chars_other: 1200
  chunk_overlap_ratio: 0.15
  skip_hidden: true
  order: recent_first           # 最近修改的文件先索引，常用文档最先可检索
  # 闲时索引（lkos index --when-idle）：问答时、使用电池时、用户在用电脑时暂停
  idle_seconds: 120
  require_ac_power: true
  poll_seconds: 5

retrieval:
  top_k: 4                      # 4K 上下文下放 4 个片段（中文约 500 字 / 片段）
  candidates_per_method: 30
  rrf_k: 60
  language_filter: soft         # soft：同语言加权但不排除 | strict：只检索同语言 | all：不区分
  same_lang_boost: 1.2
  vector_candidates: 200        # 二值粗筛候选数，越大召回越好、越慢
  strategy: flat                # flat：直接取分数最高的块 | doc_first：先选文档再选段落
                                # 2026-11-03 实测（61 题）：flat 块级命中 85%，doc_first 82%，默认用 flat
  doc_score_top: 3              # 文档得分 = 该文档最好的 3 个块的分数之和
  per_doc_max: 3                # 同一文档最多送 3 个片段
  merge_adjacent: true          # 同一文件相邻的片段合并
  neighbor_ratio: 1.5           # 最佳片段明显领先（≥ 第二名 1.5 倍）时补入前后相邻块；0 = 关闭

privacy:
  remote_enabled: false
  offline_mode: true
