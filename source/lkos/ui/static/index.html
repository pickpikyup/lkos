<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Knowledge OS</title>
<style>/*APP_CSS*/</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="对话与资料库">
    <button class="btn-new" id="btn-new" type="button">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      新对话<span class="kbd">⌘N</span>
    </button>
    <div class="side-scroll">
      <div class="side-group" id="history"></div>
      <div class="side-group">
        <div class="side-label">资料库
          <button type="button" id="btn-add-side" aria-label="添加文件夹">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          </button>
        </div>
        <div id="folders"></div>
      </div>
    </div>
    <button type="button" class="status-card empty" id="status-card">
      <div class="h"><span class="dot" aria-hidden="true"></span><span id="status-h">正在启动…</span></div>
      <div class="d" id="status-d"></div>
    </button>
    <div class="side-foot">
      <button type="button" class="side-item" id="btn-logs" hidden>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 6l2 2-2 2M8.5 10.5H11"/></svg>
        <span class="t">日志</span><span class="n" id="logs-badge"></span>
      </button>
      <button type="button" class="side-item" id="btn-models">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.8l5.4 3.1v6.2L8 14.2l-5.4-3.1V4.9z"/><path d="M2.6 4.9L8 8l5.4-3.1M8 8v6.2"/></svg>
        <span class="t">模型</span>
      </button>
      <button type="button" class="side-item" id="btn-settings">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg>
        <span class="t">设置</span>
      </button>
    </div>
  </nav>

  <main class="main" id="view-qa">
    <div class="main-scroll" id="main-scroll">
      <div class="col" id="qa-col"></div>
    </div>
    <div class="composer-wrap" id="composer-wrap">
      <div class="picker" id="picker" hidden></div>
      <form class="composer" id="composer">
        <div class="composer-top" id="composer-top" hidden></div>
        <label for="q" class="sr-only">问题</label>
        <textarea id="q" rows="2" placeholder="问一个关于你资料的问题，⌘↩ 发送"></textarea>
        <div class="row">
          <div class="seg" role="group" aria-label="模式">
            <button type="button" data-mode="chat" aria-pressed="false">对话</button>
            <button type="button" data-mode="search" aria-pressed="false">关键词检索</button>
            <button type="button" data-mode="qa" aria-pressed="true">分析</button>
            <button type="button" data-mode="analysis" aria-pressed="false">深度分析</button>
          </div>
          <span class="model-wrap" id="model-wrap">
            <label for="model-select" class="sr-only">回答用的模型</label>
            <select id="model-select" class="model-select"></select>
          </span>
          <button type="button" class="icon-btn" id="attach-btn" aria-label="附加文件" title="附加文件（也可以输入 @）">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7.5l-5.3 5.3a3.2 3.2 0 01-4.5-4.5l5.6-5.6a2.1 2.1 0 013 3L6.2 11.3a1 1 0 01-1.5-1.5L9.8 4.7"/></svg>
          </button>
          <div class="scope-wrap" id="scope-wrap">
            <button type="button" class="scope-btn" id="scope-btn" aria-expanded="false" aria-controls="scope-pop">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>
              <span id="scope-label">全部资料</span>
            </button>
            <div class="scope-pop" id="scope-pop" role="dialog" aria-label="限定范围" hidden></div>
          </div>
          <span class="grow"></span>
          <span class="hint" id="send-hint">⌘↩ 发送 · ↩ 换行</span>
          <button type="submit" class="send" aria-label="发送">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
          </button>
        </div>
      </form>
      <div class="confirm-send" id="confirm-send" hidden></div>
      <div class="generating" id="generating" hidden>
        <span id="gen-text">回答生成中，可以先在右侧核对原文</span>
        <button type="button" class="btn" id="btn-stop">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          停止 <span class="hint">Esc</span>
        </button>
      </div>
    </div>
  </main>

  <aside class="aside" id="aside" aria-label="出处"></aside>

  <main class="main" id="view-models" hidden>
    <div class="main-scroll"><div class="lib" id="models"></div></div>
  </main>

  <main class="main" id="view-settings" hidden>
    <div class="main-scroll"><div class="lib" id="settings"></div></div>
  </main>

  <main class="main" id="view-logs" hidden>
    <div class="logs-head">
      <h1>日志</h1>
      <div class="seg" role="tablist" aria-label="日志类型">
        <button type="button" role="tab" data-logtab="run" aria-pressed="true">运行日志</button>
        <button type="button" role="tab" data-logtab="calls" aria-pressed="false">模型调用</button>
      </div>
      <span class="grow"></span>
      <label class="hint" for="log-level">级别</label>
      <select id="log-level" class="mini">
        <option value="DEBUG">全部</option><option value="INFO">信息及以上</option>
        <option value="WARNING">警告及以上</option><option value="ERROR">只看错误</option>
      </select>
      <label for="log-filter" class="sr-only">筛选</label>
      <input id="log-filter" class="mini" placeholder="筛选关键词">
      <label class="hint check"><input type="checkbox" id="log-auto" checked> 自动滚动</label>
      <button type="button" class="btn small" id="log-copy">复制</button>
      <button type="button" class="btn small" id="log-clear">清空显示</button>
      <button type="button" class="btn small" id="log-folder">打开日志文件夹</button>
    </div>
    <div class="log-body" id="log-body" role="log" aria-live="off"></div>
    <div class="log-foot hint" id="log-foot"></div>
  </main>

  <main class="main" id="view-lib" hidden>
    <div class="main-scroll"><div class="lib" id="lib"></div></div>
  </main>
  <aside class="aside" id="lib-aside" hidden aria-label="后台索引说明">
    <h2>后台索引什么时候运行</h2>
    <ul class="rules">
      <li>你添加文件夹或点“立即更新”后马上开始</li>
      <li>一提问就让路，答完自动继续</li>
      <li>按每个文件夹的设置自动更新（默认每周）：在接通电源、2 分钟没用键盘鼠标时进行</li>
      <li>在文件夹的“设置”里可以排除子文件夹或文件类型</li>
      <li>随时可以暂停或关掉应用，下次打开接着做</li>
    </ul>
    <div class="src" style="cursor: default">索引和问答共用一块芯片和 8 GB 内存，同时运行只会互相拖慢，所以索引总是让问答先用。</div>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="overlay" id="consent" hidden></div>
<script>/*APP_JS*/</script>
</body>
</html>
