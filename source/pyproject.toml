[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lkos"
version = "0.1.0"
description = "Local Knowledge OS - POC 命令行版"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "psutil>=5.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "sqlite-vec>=0.1.6",
    "jieba>=0.42",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
ui = ["pywebview>=5"]

[project.scripts]
lkos = "lkos.cli:main"

[tool.setuptools.packages.find]
include = ["lkos*"]

[tool.setuptools.package-data]
lkos = ["storage/schema.sql", "config.default.yaml", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要本机运行 Ollama 并已下载模型（设置 LKOS_LIVE=1 才运行）",
]
addopts = "-p no:cacheprovider"
